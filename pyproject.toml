[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isviz"
version = "1.0.0"
description = "Income statement analysis for any SEC filer: XBRL extraction, ratio analysis, Excel export, AI commentary, and an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jon Mezzadri" }]
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "plotly>=5.20",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
mcp = ["mcp>=2.0"]
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-requests", "pandas-stubs"]

[project.scripts]
isviz = "isviz.cli:app"
isviz-mcp = "isviz.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isviz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live SEC API (deselect with -m 'not network')"]
